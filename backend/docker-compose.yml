services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: evex
      POSTGRES_USER: evex
      POSTGRES_PASSWORD: evex
    ports:
      - "5432:5432"
    volumes:
      - evex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evex -d evex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evex-postgres-data:
