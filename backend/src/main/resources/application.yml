spring:
  application:
    name: evex-indexer
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/evex}
    username: ${SPRING_DATASOURCE_USERNAME:evex}
    password: ${SPRING_DATASOURCE_PASSWORD:evex}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
  jpa:
    hibernate:
      # Padrão da PoC (DEC-006): ddl-auto no dia a dia + Flyway usado pontualmente quando necessário
      # (ex.: ajuste de sequence, dado de seed) — não Flyway puro.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # E8.1/DEC-041: `spring-boot-flyway` (build.gradle.kts) estava ausente até esta etapa — Flyway
    # nunca rodou de fato antes disso, apesar de `enabled: true` já estar aqui desde E0 (a
    # autoconfiguração correspondente simplesmente não existia no classpath, mesma modularização por
    # tecnologia de DEC-019/DEC-020/DEC-028). A ordem real de execução (Flyway depois do Hibernate
    # criar o schema via ddl-auto, não antes) é controlada por
    # config/PostSchemaFlywayMigrator.kt, não pelo hook automático padrão do Spring Boot — ver DEC-041.
    #
    # DEC-022: 1ª migration real do projeto (V1__contract_abis_unique_open_version.sql) — o schema já
    # existe via ddl-auto: update (DEC-006) em qualquer banco rodando desde antes desta etapa, então o
    # baseline explícito é necessário: sem baseline-version: 0, o baseline default (versão 1)
    # empataria com V1 e a "pularia" sem executar de fato (ver
    # backend/docs/performance-and-ops-notes.md).
    baseline-on-migrate: true
    baseline-version: 0

server:
  error:
    include-stacktrace: never
    include-exception: false

logging:
  level:
    br.com.bbchain.evex.indexer: ${EVEX_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

indexer:
  # MAINNET | TESTNET — tag de rede aplicada a todo BlockchainEvent ingerido por esta instância
  # (decisão da E4: "instância por rede", não deriva de MonitoredContract porque a ingestão é da rede
  # inteira, DEC-001 — a maioria dos logs é de endereço não cadastrado).
  network: ${EVEX_NETWORK:TESTNET}
  # Intervalo mínimo entre 2 logs WARN consecutivos pra uma mesma config de saldo/webhook mal
  # configurada (E11, resíduo de DEC-035) — WarnLogDeduper, usado por BalanceProjectionService e
  # WebhookMatchingService. Aceita formato Spring (ex.: 5m, 30s, PT5M).
  warn-log-dedupe-interval: ${EVEX_WARN_LOG_DEDUPE_INTERVAL:5m}
  abi-storage:
    # database | local | hybrid — usado quando POST /v1/contracts/{address}/abi não informa `storage`
    # explicitamente. Trocar aqui não exige mudança de código (AbiStorageResolver).
    default: database
    local-path: ${EVEX_ABI_LOCAL_STORAGE_PATH:./data/abis}
  blockchain:
    rpc-url: ${EVEX_RPC_URL:http://localhost:8545}
    # Besu IBFT2/QBFT é determinístico por bloco (DEC-005) — default baixo, revisar quando houver
    # rede Besu real (E12).
    confirmations: ${EVEX_CONFIRMATIONS:0}
    batch-size: ${EVEX_POLL_BATCH_SIZE:1000}
    min-batch-size: ${EVEX_POLL_MIN_BATCH_SIZE:1}
    poll-interval-ms: ${EVEX_POLL_INTERVAL_MS:5000}
    # POLLING (default) | WEBSOCKET | NONE — qual gatilho dispara a ingestão (E26/DEC-091). POLLING é o
    # @Scheduled de intervalo fixo (poll-interval-ms acima), já validado em produção (E4/E12). WEBSOCKET
    # assina eth_subscribe("newHeads") numa 2ª conexão Web3j (ws-url abaixo) e dispara o mesmo tick a
    # cada bloco novo — troque só se o nó tiver WS habilitado; NÃO validado ao vivo ainda, só via mock
    # (ver DEC-091). NONE desliga os dois gatilhos (usado só em teste, AbstractIntegrationTest).
    transport: ${EVEX_BLOCKCHAIN_TRANSPORT:POLLING}
    # Só usado quando transport=WEBSOCKET — URL do WebSocketService do Web3j (instância separada da
    # usada por Web3jBlockchainClient, que continua 100% HTTP via rpc-url acima).
    ws-url: ${EVEX_BLOCKCHAIN_WS_URL:ws://localhost:8546}
    # PAT/Bearer opcional (Authorization: Bearer <token>) — pra redes que exigem auth no RPC (ex.: rede
    # Besu de teste da EBS, E27). Vazio (default) preserva 100% o comportamento sem auth de hoje.
    auth-token: ${EVEX_BLOCKCHAIN_AUTH_TOKEN:}
    # Desliga o envio do header sem remover o token do ambiente. Default true: só setar auth-token já
    # basta pra ativar o auth (DEC-094).
    auth-enabled: ${EVEX_BLOCKCHAIN_AUTH_ENABLED:true}
    keycloak:
      # Obtenção DINÂMICA de token via Keycloak (grant_type=password), alternativa ao PAT estático
      # acima — pra redes que exigem login de verdade (ex.: rede Besu real da EBS, E27 complemento).
      # Vazio (default) desliga o modo Keycloak inteiro; nesse caso cai no PAT estático (auth-token/
      # auth-enabled acima). Se preenchido, tem PRECEDÊNCIA sobre o PAT estático (DEC-095).
      token-url: ${EVEX_BLOCKCHAIN_KEYCLOAK_TOKEN_URL:}
      # Sem default fixo de propósito — cada rede real tem o seu client. O Anbima usava um client
      # público ("login-app", sem client-secret) como referência.
      client-id: ${EVEX_BLOCKCHAIN_KEYCLOAK_CLIENT_ID:}
      # Opcional — só entra no form de login/refresh se não-branco (cobre client confidencial).
      client-secret: ${EVEX_BLOCKCHAIN_KEYCLOAK_CLIENT_SECRET:}
      username: ${EVEX_BLOCKCHAIN_KEYCLOAK_USERNAME:}
      password: ${EVEX_BLOCKCHAIN_KEYCLOAK_PASSWORD:}
      scope: ${EVEX_BLOCKCHAIN_KEYCLOAK_SCOPE:openid profile email}
      # Margem de segurança antes do access token expirar de verdade (renova um pouco antes).
      refresh-skew: ${EVEX_BLOCKCHAIN_KEYCLOAK_REFRESH_SKEW:30s}
  redecode:
    # Tamanho do lote da reindexação assíncrona (ingestion-pipeline-reference.md §4) — orquestrador
    # RedecodeOrchestrator/RedecodeRunner/RedecodeBatchProcessor (E5).
    batch-size: ${EVEX_REDECODE_BATCH_SIZE:100}
  sse:
    # Streams SSE de status de job (E17 / DEC-074) — GET /v1/redecode/status/stream e
    # GET /v1/balance-monitors/backfill/status/stream. heartbeat abaixo do timeout ocioso típico de
    # proxy; emitter-timeout longo (o EventSource reconecta sozinho, só evita conexão zumbi eterna).
    heartbeat-interval-ms: ${EVEX_SSE_HEARTBEAT_INTERVAL_MS:15000}
    emitter-timeout-ms: ${EVEX_SSE_EMITTER_TIMEOUT_MS:1800000}
  blockscout:
    # Vazio (default) = discovery/origem BLOCKSCOUT/fallback de detecção de interface desabilitados —
    # BlockscoutClient lança BlockscoutUnavailableException (503) direto, sem tentar HTTP. Nenhuma
    # instância Blockscout de teste disponível ainda (mesma classe de pendência de E12/DEC-010).
    base-url: ${EVEX_BLOCKSCOUT_URL:}
    # DEC-107 — logs `Upgraded` da rede inteira (uma consulta sem filtro de endereço) para detectar
    # proxies/implementações. Liga/desliga o uso na camada de aplicação.
    upgrade-logs-enabled: true
    # TTL do cache em memória do resultado dessa consulta (Duration; 0 desliga o cache).
    upgrade-logs-cache-ttl: 30s
    # Teto de páginas (paginação por bloco, 1000 logs/página) antes de marcar o resultado como truncado.
    upgrade-logs-max-pages: 10
    # Timeouts do cliente HTTP do Blockscout (valem para TODOS os endpoints). Leitura de 15s (e não 10s)
    # porque GET /smart-contracts/{address} devolve corpo de ~1 MB que pode demorar em rede lenta.
    connect-timeout: 2s
    read-timeout: 15s
  balance:
    # Cron do job noturno de consolidação de saldo (doc §4.4, BalanceSnapshotJob) — default meia-noite,
    # diário. Sem guarda de concorrência própria: o Spring não roda 2 execuções do mesmo método
    # @Scheduled em paralelo (mesma garantia já usada pelo ScheduledPollTrigger, E4/E26).
    snapshot-cron: ${EVEX_BALANCE_SNAPSHOT_CRON:0 0 0 * * *}
    # Tamanho do lote do backfill de saldo sob demanda (E14, DEC-066) — orquestrador
    # BalanceBackfillOrchestrator/BalanceBackfillRunner/BalanceBackfillBatchProcessor, espelha
    # indexer.redecode.batch-size.
    backfill-batch-size: ${EVEX_BALANCE_BACKFILL_BATCH_SIZE:500}
  webhook:
    # Notificação de saída (indexer→sistema externo, DEC-004) — WebhookDispatchJob (E8, doc §4.6).
    dispatch-interval-ms: ${EVEX_WEBHOOK_DISPATCH_INTERVAL_MS:5000}
    dispatch-batch-size: ${EVEX_WEBHOOK_DISPATCH_BATCH_SIZE:50}
    max-attempts: ${EVEX_WEBHOOK_MAX_ATTEMPTS:5}
    base-delay-seconds: ${EVEX_WEBHOOK_BASE_DELAY_SECONDS:10}
    max-delay-seconds: ${EVEX_WEBHOOK_MAX_DELAY_SECONDS:300}
    request-timeout-ms: ${EVEX_WEBHOOK_REQUEST_TIMEOUT_MS:5000}
    # E33 — preview/reenvio manual de webhooks (GET /v1/capabilities expõe estes valores à UI).
    resend:
      # URL de destino de teste no reenvio: DESLIGADO por padrão (SSRF, sem auth na PoC).
      allow-url-override: ${EVEX_WEBHOOK_RESEND_ALLOW_URL_OVERRIDE:false}
      max-events-per-request: ${EVEX_WEBHOOK_RESEND_MAX_EVENTS_PER_REQUEST:50}
      preview-max-events: ${EVEX_WEBHOOK_PREVIEW_MAX_EVENTS:5}
      # matching-events: teto de eventos varridos (pré-filtro SQL + filtros do webhook em memória) por requisição.
      max-scan: ${EVEX_WEBHOOK_MATCHING_MAX_SCAN:5000}
      # Limites de abuso (sem autenticação na PoC): fila de reenvios PENDING e taxa em memória (janela de 1 min).
      max-pending-resends: ${EVEX_WEBHOOK_RESEND_MAX_PENDING:500}
      queue-full-retry-after-seconds: ${EVEX_WEBHOOK_RESEND_QUEUE_FULL_RETRY_AFTER_SECONDS:30}
      max-resends-per-minute-per-webhook: ${EVEX_WEBHOOK_RESEND_MAX_PER_MINUTE_PER_WEBHOOK:10}
      max-requests-per-minute-per-instance: ${EVEX_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_INSTANCE:30}
      # Política de destino da URL de teste (OutboundUrlPolicy): portas permitidas e allowlist de laboratório
      # (hosts exatos e/ou CIDRs; vazia = nada além do público). Só tem efeito com allow-url-override=true.
      allowed-ports: ${EVEX_WEBHOOK_RESEND_ALLOWED_PORTS:80,443}
      url-allowlist: ${EVEX_WEBHOOK_RESEND_URL_ALLOWLIST:}
    # Ponto de extensão (E33/DEC-116, D4): política de destino aplicada à URL CADASTRADA — OFF | WARN | ENFORCE.
    # Reservado: nesta entrega NENHUM código lê este modo (sem enforcement na URL cadastrada).
    url-policy:
      mode: ${EVEX_WEBHOOK_URL_POLICY_MODE:OFF}
  cors:
    # E8.1 — origens permitidas a consumir /v1/** via browser (config/SecurityConfig.kt, DEC via
    # Spring Security, não WebMvcConfigurer — ver docs/decisions.md). Default é a porta padrão do
    # `npm run dev` do Vite (E9). Lista separada por vírgula, convertida automaticamente em
    # List<String> pelo @ConfigurationProperties do Spring Boot (relaxed binding).
    allowed-origins: ${EVEX_CORS_ALLOWED_ORIGINS:http://localhost:5173}
