type: object
description: Configuração de monitoramento de saldo cadastrada pelo usuário (doc de produto §4.4).
required:
  - id
  - contractAddress
  - network
  - eventName
  - behavior
  - valueParam
  - active
  - createdAt
properties:
  id:
    type: string
    format: uuid
    description: Identificador interno do registro.
  contractAddress:
    type: string
    pattern: "^0x[a-fA-F0-9]{40}$"
    description: Endereço do contrato monitorado cujos eventos alimentam esta configuração.
  network:
    $ref: "../enum/network.yaml"
  eventName:
    type: string
    description: "Nome do evento decodificado que dispara esta configuração (ex.: Transfer)."
  behavior:
    $ref: "../enum/balance-behavior.yaml"
  walletParam:
    type: string
    nullable: true
    description: "Nome do parâmetro do evento que carrega a carteira afetada. Obrigatório para CREDIT/DEBIT/DELTA; ausente para TRANSFER."
  fromParam:
    type: string
    nullable: true
    description: "Nome do parâmetro de origem da transferência. Obrigatório só para TRANSFER."
  toParam:
    type: string
    nullable: true
    description: "Nome do parâmetro de destino da transferência. Obrigatório só para TRANSFER."
  valueParam:
    type: string
    description: Nome do parâmetro do evento que carrega o montante/delta a aplicar no saldo.
  tokenIdParam:
    type: string
    nullable: true
    description: "Nome do parâmetro do evento que carrega o tokenId (ex.: ERC1155/ERC721). `null` = não aplicável (ex.: ERC20)."
  batch:
    type: boolean
    default: false
    description: >-
      Quando true, `valueParam` (e `tokenIdParam`, se informado) referenciam parâmetros do tipo array
      (ex.: uint256[]) e cada posição é aplicada como um lançamento independente, usando o `behavior`
      configurado; `walletParam`/`fromParam`/`toParam` continuam escalares. Arrays de tamanhos diferentes
      descartam o evento inteiro. Default false. Editar para true não reprojeta histórico (crie uma
      configuração nova e rode o backfill).
  active:
    type: boolean
    description: Se esta configuração está ativa (projeta saldo a cada evento decodificado) ou pausada.
  createdAt:
    type: string
    format: date-time
    description: Momento em que esta configuração foi cadastrada.
  warnings:
    type: array
    nullable: true
    items:
      type: string
    description: >-
      Avisos de validação não bloqueantes em PT-BR (ex.: `batch` incompatível com a ABI de algumas
      versões do contrato). Só preenchido nas respostas de `POST`/`PUT`; ausente quando não há avisos.
