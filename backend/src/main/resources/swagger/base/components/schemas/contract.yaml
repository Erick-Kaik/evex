type: object
description: Contrato monitorado pelo Evex (doc de produto §4.1).
required:
  - id
  - address
  - name
  - network
  - status
properties:
  id:
    type: string
    format: uuid
    description: Identificador interno do registro.
  address:
    type: string
    pattern: "^0x[a-fA-F0-9]{40}$"
    description: Endereço do contrato na rede. Imutável após a criação.
  name:
    type: string
    description: Nome dado pelo usuário ao contrato monitorado.
  description:
    type: string
    nullable: true
    description: Descrição livre do contrato monitorado.
  version:
    type: string
    nullable: true
    description: "Versão do contrato monitorado (ex.: versão da implementação atrás de um proxy)."
  network:
    $ref: "../enum/network.yaml"
  status:
    $ref: "../enum/contract-status.yaml"
  lineageId:
    type: string
    format: uuid
    nullable: true
    description: >-
      Identificador da linhagem de "contratos redeployados" (E29/DEC-096) que este contrato pertence.
      `null` para contratos cadastrados antes desta funcionalidade (sem linhagem conhecida). Não nulo
      para qualquer contrato cadastrado depois — mesmo sem `predecessorAddress` informado, toda linhagem
      nasce trivialmente com tamanho 1.
