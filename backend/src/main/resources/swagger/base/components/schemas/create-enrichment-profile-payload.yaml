type: object
description: >-
  Corpo do cadastro de um novo Perfil de Enriquecimento. `status` não faz parte deste payload — todo
  perfil novo nasce ACTIVE no servidor.
required:
  - name
  - network
  - calls
properties:
  name:
    type: string
    minLength: 1
    description: Nome dado pelo usuário ao perfil.
  description:
    type: string
    nullable: true
    description: Descrição livre do perfil.
  network:
    $ref: "../enum/network.yaml"
  calls:
    type: array
    minItems: 1
    description: Chamadas de leitura, na ordem em que serão resolvidas.
    items:
      $ref: "./enrichment-call.yaml"
