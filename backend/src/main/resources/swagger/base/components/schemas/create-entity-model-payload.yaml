type: object
description: >-
  Corpo do cadastro de um novo Modelo de Entidade. `status` não faz parte deste payload — todo modelo
  novo nasce ACTIVE no servidor.
required:
  - name
  - network
  - contributors
properties:
  name:
    type: string
    minLength: 1
    description: Nome dado pelo usuário ao modelo.
  description:
    type: string
    nullable: true
    description: Descrição livre do modelo.
  network:
    $ref: "../enum/network.yaml"
  contributors:
    type: array
    minItems: 1
    description: Eventos contribuintes deste modelo.
    items:
      $ref: "./model-contributor.yaml"
