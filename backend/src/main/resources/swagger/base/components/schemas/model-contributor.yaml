type: object
description: >-
  Um evento contribuinte de um Modelo de Entidade — identifica de qual `(contractAddress, eventName)`
  vêm os campos, qual parâmetro decodificado identifica a entidade (`correlationParam`) e quais campos
  decodificados entram no modelo acumulado (`fieldMappings`).
required:
  - contractAddress
  - eventName
  - correlationParam
  - fieldMappings
properties:
  contractAddress:
    type: string
    pattern: "^0x[a-fA-F0-9]{40}$"
    description: Endereço do contrato monitorado que emite o evento contribuinte.
  eventName:
    type: string
    minLength: 1
    description: Nome do evento decodificado que contribui para o modelo.
  correlationParam:
    type: string
    minLength: 1
    description: Nome do parâmetro decodificado deste evento que identifica a entidade.
  fieldMappings:
    type: array
    minItems: 1
    description: Quais campos deste evento entram no modelo acumulado, e com que nome.
    items:
      $ref: "./model-field-mapping.yaml"
