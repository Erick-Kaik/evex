type: object
description: >-
  Corpo da atualização de um contrato monitorado. `address` e `network` não fazem parte deste payload
  — são imutáveis depois de criados.
required:
  - name
properties:
  name:
    type: string
    minLength: 1
    description: Nome dado pelo usuário ao contrato monitorado.
  description:
    type: string
    nullable: true
    description: Descrição livre do contrato monitorado.
  version:
    type: string
    nullable: true
    description: "Versão do contrato monitorado (ex.: versão da implementação atrás de um proxy)."
