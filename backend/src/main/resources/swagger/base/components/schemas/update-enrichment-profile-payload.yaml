type: object
description: >-
  Corpo da atualização de um Perfil de Enriquecimento. `network` não faz parte deste payload —
  imutável depois de criado.
required:
  - name
  - calls
properties:
  name:
    type: string
    minLength: 1
    description: Nome dado pelo usuário ao perfil.
  description:
    type: string
    nullable: true
    description: Descrição livre do perfil.
  calls:
    type: array
    minItems: 1
    description: Chamadas de leitura, na ordem em que serão resolvidas.
    items:
      $ref: "./enrichment-call.yaml"
