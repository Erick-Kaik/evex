type: object
description: >-
  Corpo da atualização de um webhook — substitui todos os campos editáveis. `active` não faz parte
  deste payload — use `PATCH /v1/webhooks/{id}/status` para ativar/pausar.
required:
  - contractAddress
  - network
  - eventName
  - url
properties:
  contractAddress:
    type: string
    pattern: "^0x[a-fA-F0-9]{40}$"
    description: Endereço do contrato monitorado cujos eventos disparam este webhook.
  network:
    $ref: "../enum/network.yaml"
  eventName:
    type: string
    minLength: 1
    description: "Nome do evento decodificado que dispara este webhook (ex.: Transfer)."
  url:
    type: string
    format: uri
    description: URL de destino do `POST` disparado quando um evento bate no filtro.
  filters:
    type: array
    description: "Condições de filtro opcionais — ausente/vazio = sem filtro, sempre dispara."
    items:
      $ref: "./filter-condition.yaml"
  payloadTemplate:
    type: string
    nullable: true
    description: >-
      Template JSON opcional com placeholders `{{campo}}`/`{{decodedParameters.nome}}`. Validado na
      edição: precisa renderizar como JSON válido, senão a requisição é rejeitada com 400.
  enrichmentProfileIds:
    type: array
    description: >-
      Perfis de Enriquecimento (E19/DEC-082) referenciados, na ordem em que suas chamadas são
      resolvidas no dispatch. Ausente/vazio = sem enriquecimento on-chain (comportamento pré-E19).
    items:
      type: string
      format: uuid
  entityModelIds:
    type: array
    description: >-
      Modelos de Entidade (E19/DEC-082) referenciados — cada modelo precisa ter algum contribuinte que
      case com o `(contractAddress, eventName)` deste próprio webhook. Ausente/vazio = sem campos
      `{{model.*}}` (comportamento pré-E19).
    items:
      type: string
      format: uuid
