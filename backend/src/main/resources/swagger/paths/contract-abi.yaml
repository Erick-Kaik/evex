post:
  tags:
    - Contracts
  operationId: registerContractAbi
  summary: Cadastra uma nova versão de ABI para um contrato monitorado
  description: >-
    Erros: 400 (ABI inválida/ordem de versões), 404 (contrato ou ABI do Blockscout não encontrados),
    409 (conflito de versão), 422 `BLOCKSCOUT_IMPLEMENTATION_ABI_NOT_FOUND` (`source=BLOCKSCOUT` com
    `implementationAddress` sem ABI verificada no Blockscout), 503 `BLOCKSCOUT_UNAVAILABLE`
    (`source=BLOCKSCOUT` com Blockscout indisponível ou não configurado).
  parameters:
    - $ref: "../base/components/param/path/contract-address.yaml"
  requestBody:
    $ref: "../base/components/requests/register-abi-request.yaml"
  responses:
    "201":
      $ref: "../base/components/responses/contract-abi-response.yaml"
    "400":
      $ref: "../base/components/responses/error-response.yaml"
    "404":
      $ref: "../base/components/responses/error-response.yaml"
    "409":
      $ref: "../base/components/responses/error-response.yaml"
    "422":
      $ref: "../base/components/responses/error-response.yaml"
    "503":
      $ref: "../base/components/responses/error-response.yaml"
get:
  tags:
    - Contracts
  operationId: listContractAbiVersions
  summary: Lista as versões de ABI cadastradas para um contrato monitorado
  parameters:
    - $ref: "../base/components/param/path/contract-address.yaml"
  responses:
    "200":
      $ref: "../base/components/responses/contract-abi-list-response.yaml"
    "404":
      $ref: "../base/components/responses/error-response.yaml"
