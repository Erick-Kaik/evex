get:
  tags:
    - Wallets
  operationId: listWallets
  summary: Lista carteiras cadastradas
  parameters:
    - $ref: "../base/components/param/query/network.yaml"
    - $ref: "../base/components/param/query/page.yaml"
    - $ref: "../base/components/param/query/size.yaml"
  responses:
    "200":
      $ref: "../base/components/responses/wallet-page-response.yaml"
    "400":
      $ref: "../base/components/responses/error-response.yaml"
post:
  tags:
    - Wallets
  operationId: createWallet
  summary: Cadastra uma nova carteira
  requestBody:
    $ref: "../base/components/requests/create-wallet-request.yaml"
  responses:
    "201":
      $ref: "../base/components/responses/wallet-response.yaml"
    "400":
      $ref: "../base/components/responses/error-response.yaml"
    "409":
      $ref: "../base/components/responses/error-response.yaml"
